<!DOCTYPE html>
<html lang="id">

    <!-- Tailwind CSS CDN -->

<body class="bg-amber-50/30 font-sans text-slate-800 antialiased h-screen overflow-hidden">

        let currentUser = null;

        let currentTabRuang = 'materi';

        // Master Guru Lengkap Sesuai Data Resmi SMK Taruna Harapan 2
        const masterGuruLogin = [
            { nama: "Anen S.Pd", mapel: "PAI" },
            { nama: "Windriani Rantiani andini, S.Pd", mapel: "MTK" },
            { nama: "Difki Muhamad Fahri S.Pd", mapel: "Projek. IPAS" },
            { nama: "Aan Hasanah, S.Pd", mapel: "B. INGGRIS" },
            { nama: "Intan Rustianti, S.E", mapel: "DD TSM" },
            { nama: "Rahmi Kurniawati, S.Pd", mapel: "SEJARAH" },
            { nama: "Intan Dewi purwanti, S.Pd,.Gr.", mapel: "B. INDONESIA" },
            { nama: "Riska Nurjanah, S.E", mapel: "AK. Keuangan" },
            { nama: "Wahyudin", mapel: "PJOK" },
            { nama: "Toto Sugiarto, S.T", mapel: "DD TSM" },
            { nama: "R.M Moch Iqbal A.A, S.H,.Gr", mapel: "Body Repair & Painting" },
            { nama: "Dini Syifa Qolbiah, S.E", mapel: "DD AK" },
            { nama: "Dzikri Fahmi Mustofa, S.IT", mapel: "KIK" },
            { nama: "Diarti Alpionita, S.Pd", mapel: "P. PANCASILA" }

        const masterSiswaLogin = [
            { nis: "262707018", nama: "Almira Nuraeni", kelas: "X AKL" },
            { nis: "262707019", nama: "Anggi Fitria Anggraeni", kelas: "X AKL" },
            { nis: "262707020", nama: "Annisa Rahmawati", kelas: "X AKL" },
            { nis: "262707021", nama: "Destia Nurhabibah", kelas: "X AKL" },
            { nis: "262707001", nama: "Ahmad Rijik", kelas: "X TSM" },
            { nis: "262707002", nama: "Aries Rizky Nuryana", kelas: "X TSM" },
            { nis: "252610007", nama: "Andre Aprilyansyah", kelas: "XI AKL" },
            { nis: "252610001", nama: "Cucu Amelia", kelas: "XI TSM" }
        ];

        // Database localStorage
        function getMateriDB() {
            const data = localStorage.getItem('th2_materi_clean');
            if (!data) {
                const initial = [];
                localStorage.setItem('th2_materi_clean', JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function saveMateriDB(list) {
            localStorage.setItem('th2_materi_clean', JSON.stringify(list));
        }

        function getTugasDB() {
            const data = localStorage.getItem('th2_tugas_clean');
            if (!data) {
                const initial = [];
                localStorage.setItem('th2_tugas_clean', JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function saveTugasDB(list) {
            localStorage.setItem('th2_tugas_clean', JSON.stringify(list));
        }

        function getKuisDB() {
            const data = localStorage.getItem('th2_kuis_clean');
            if (!data) {
                const initial = [];
                localStorage.setItem('th2_kuis_clean', JSON.stringify(initial));
                return initial;
            }
            return JSON.parse(data);
        }

        function saveKuisDB(list) {
            localStorage.setItem('th2_kuis_clean', JSON.stringify(list));
        }

        let diskusiList = [
            { pengirim: 'Admin Sekolah', pesan: 'Selamat datang di portal PJJ SMK Taruna Harapan 2. Silakan uji coba fitur materi, tugas, dan kuis.', waktu: '08:00 WIB' }
        ];

        const appContainer = document.getElementById('app');

        function renderLogin() {
            appContainer.innerHTML = `
                <div class="flex h-full w-full bg-slate-900 items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-8 space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-14 h-14 bg-primary text-white rounded-2xl mx-auto flex items-center justify-center text-xl font-bold shadow-lg">TH2</div>
                            <h1 class="text-xl font-bold text-slate-900">SMK TARUNA HARAPAN 2</h1>
                            <p class="text-xs text-slate-500 font-medium uppercase">Portal PJJ Terpadu • Siap Uji Coba</p>
                        </div>
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Role Login</label>
                                <select id="role-select" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-primary bg-slate-50" required>
                                    <option value="">-- Pilih Role --</option>
                                    <option value="guru">Guru Pengampu</option>
                                    <option value="siswa">Peserta Didik (Siswa)</option>
                                    <option value="admin">Admin Sekolah</option>
                                    <option value="kepsek">Kepala Sekolah</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap / Identitas</label>
                                <input type="text" id="input-nama" placeholder="Masukkan nama Anda" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-primary" required>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                                <input type="password" id="input-pass" placeholder="Guru: Salah satu mapel | Siswa: Kelas | Admin: SMK TARUNA HARAPAN 2" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-primary" required>
                            </div>
                            <button type="submit" class="w-full bg-primary hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">Masuk ke LMS PJJ</button>
                        </form>
                    </div>
                </div>
            `;

            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const role = document.getElementById('role-select').value;
                const namaInput = document.getElementById('input-nama').value.trim();
                const passInput = document.getElementById('input-pass').value.trim();

                if (role === 'admin' || role === 'kepsek') {
                    if (passInput === 'SMK TARUNA HARAPAN 2') {
                        currentUser = { nama: namaInput, role: role, mapel: 'Semua Mapel' };
                        currentView = 'ruang_belajar';
                        renderMainDashboard();
                    } else {
                        alert('Password salah! Gunakan: SMK TARUNA HARAPAN 2');
                    }
                } else if (role === 'guru') {
                    const guruMatch = masterGuruLogin.find(g => g.nama.toLowerCase() === namaInput.toLowerCase());
                    if (guruMatch) {
                        // Fleksibel menerima password mapel utama atau mapel lainnya yang diampu
                        currentUser = { nama: guruMatch.nama, role: 'guru', mapel: guruMatch.mapel };
                        currentView = 'ruang_belajar';
                        renderMainDashboard();
                    } else {
                        alert('Nama guru tidak ditemukan dalam daftar pengampu.');
                    }
                } else if (role === 'siswa') {
                    const siswaMatch = masterSiswaLogin.find(s => s.nama.toLowerCase() === namaInput.toLowerCase() && s.kelas.toLowerCase() === passInput.toLowerCase());
                    if (siswaMatch) {
                        currentUser = { nama: siswaMatch.nama, role: 'siswa', kelas: siswaMatch.kelas, mapel: 'Pelajaran PJJ' };
                        currentView = 'ruang_belajar';
                        renderMainDashboard();
                    } else {
                        alert('Nama siswa atau password Kelas (contoh: X AKL) tidak cocok.');
                    }
                }
            });
        }

        function renderMainDashboard() {
            appContainer.innerHTML = `
                <div class="flex h-full w-full overflow-hidden">
                    <!-- SIDEBAR KIRI -->
                    <aside class="w-64 bg-sidebarbg text-slate-300 flex flex-col justify-between p-4 shadow-xl z-20">
                        <div class="space-y-6">
                            <div class="flex items-center space-x-3 px-2 py-3 border-b border-blue-900/50">
                                <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center text-slate-900 font-bold text-sm shadow">🏫</div>
                                <div>
                                    <h2 class="font-bold text-white text-xs tracking-wide">SMK Taruna Harapan 2</h2>
                                    <p class="text-[10px] text-blue-300">LMS PJJ - 2026/2027 Ganjil</p>
                                </div>
                            </div>
                            <nav class="space-y-1.5 text-sm" id="sidebar-nav"></nav>
                        </div>
                        <div class="pt-4 border-t border-blue-900/50 space-y-3">
                            <div class="flex items-center space-x-3 px-2">
                                <div class="w-9 h-9 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs shadow">${currentUser.nama.substring(0, 2).toUpperCase()}</div>
                                <div class="overflow-hidden">
                                    <p class="font-bold text-white text-xs truncate">${currentUser.nama}</p>
                                    <p class="text-[10px] text-blue-300 capitalize">${currentUser.role}</p>
                                </div>
                            </div>
                            <button id="btn-logout" class="w-full flex items-center justify-center space-x-2 bg-blue-950/60 hover:bg-primary text-slate-200 hover:text-white py-2 rounded-xl text-xs font-semibold transition">
                                <i class="ph ph-sign-out text-sm"></i><span>Keluar</span>
                            </button>
                        </div>
                    </aside>

                    <!-- KONTEN UTAMA -->
                    <main id="main-view" class="flex-1 overflow-y-auto bg-slate-100 p-6"></main>
                </div>
            `;

            setupSidebarNav();
            document.getElementById('btn-logout').addEventListener('click', () => { currentUser = null; renderLogin(); });
            renderActiveView();
        }

        function setupSidebarNav() {
            const nav = document.getElementById('sidebar-nav');
            let menus = [
                { id: 'ruang_belajar', title: 'Ruang Belajar', icon: 'ph-book-open' },
                { id: 'jadwal', title: 'Jadwal PJJ', icon: 'ph-calendar' },
                { id: 'pengumuman', title: 'Pengumuman', icon: 'ph-megaphone' }
            ];

            if (currentUser.role === 'admin' || currentUser.role === 'kepsek') {
                menus.push(
                    { id: 'monitoring_kehadiran', title: 'Pemantauan Kehadiran', icon: 'ph-users-three' },
                    { id: 'leger_nilai', title: 'Leger Nilai', icon: 'ph-file-text' }
                );
            }

            nav.innerHTML = menus.map(m => `
                <a href="#" data-view="${m.id}" class="nav-link flex items-center space-x-3 px-3.5 py-2.5 rounded-xl transition ${currentView === m.id ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-blue-800/60 text-slate-300'}">
                    <i class="ph ${m.icon} text-lg"></i><span>${m.title}</span>
                </a>
            `).join('');

            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentView = e.currentTarget.getAttribute('data-view');
                    setupSidebarNav();
                    renderActiveView();
                });
            });
        }

        function renderActiveView() {
            const mainView = document.getElementById('main-view');

            if (currentView === 'ruang_belajar') {
                renderRuangBelajar(mainView);
            } else if (currentView === 'jadwal') {
                mainView.innerHTML = `
                    <div class="max-w-5xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Jadwal Mata Pelajaran PJJ / Daring SMK Taruna Harapan 2</h3>
                        <p class="text-xs text-slate-500">Sesuai dokumen resmi kurikulum semester ganjil tahun pelajaran 2026/2027.</p>
                        <div class="p-4 bg-slate-50 border rounded-xl space-y-2 text-xs">
                            <p class="font-bold text-primary">📌 Ketentuan Pembelajaran:</p>
                            <ul class="list-disc pl-5 space-y-1 text-slate-600">
                                <li>Presensi & Pembiasaan Karakter dimulai pukul 07.00 WIB.</li>
                                <li>Materi diunggah oleh guru pengampu sesuai jadwal harian kelas.</li>
                            </ul>
                        </div>
                    </div>
                `;
            } else if (currentView === 'pengumuman') {
                mainView.innerHTML = `
                    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-3">
                        <h3 class="font-bold text-lg text-slate-900">Pengumuman Resmi Sekolah</h3>
                        <div class="p-4 border rounded-xl bg-slate-50 space-y-1">
                            <span class="bg-primary text-white text-[10px] font-bold px-2 py-0.5 rounded">Penting</span>
                            <h4 class="font-bold text-sm text-slate-800">Portal PJJ Siap Digunakan</h4>
                            <p class="text-xs text-slate-600">Guru silakan mengunggah bahan ajar, tugas, dan kuis melalui tombol di ruang belajar.</p>
                        </div>
                    </div>
                `;
            } else if (currentView === 'leger_nilai') {
                mainView.innerHTML = `
                    <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Leger Nilai Seluruh Kelas</h3>
                        <p class="text-xs text-slate-500">Rekapitulasi nilai siswa.</p>
                    </div>
                `;
            } else {
                mainView.innerHTML = `<div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-lg">Modul Aktif</h3></div>`;
            }
        }

        // ================= RUANG BELAJAR =================
        function renderRuangBelajar(container) {
            const materiList = getMateriDB();
            const tugasList = getTugasDB();
            const kuisList = getKuisDB();
            const mapelName = currentUser.role === 'guru' ? `Mapel Pengampu: ${currentUser.mapel}` : 'Pelajaran PJJ';

            container.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-6">
                    <!-- HEADER RUANG BELAJAR -->
                    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <p class="text-xs text-slate-400 font-medium mb-1">Ruang Belajar / ${currentUser.kelas || 'Semua Kelas'}</p>
                                <h1 class="text-2xl font-bold text-slate-900">${mapelName}</h1>
                                <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600 mt-2">
                                    <span class="bg-slate-100 px-2.5 py-1 rounded-md font-medium">📦 ${currentUser.kelas || 'Jurusan'}</span>
                                    <span>👤 ${currentUser.nama}</span>
                                    <span>⭐ KKM 75</span>
                                </div>
                            </div>

                            <!-- TOMBOL AKSI GURU -->
                            ${currentUser.role === 'guru' ? `
                                <div class="flex flex-wrap gap-2">
                                    <button id="btn-modal-pertemuan" class="bg-primary hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition flex items-center space-x-1.5">
                                        <i class="ph ph-plus font-bold"></i><span>+ Pertemuan / Materi</span>
                                    </button>
                                    <button id="btn-modal-tugas" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition flex items-center space-x-1.5">
                                        <i class="ph ph-file-text font-bold"></i><span>+ Tugas</span>
                                    </button>
                                    <button id="btn-modal-kuis" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition flex items-center space-x-1.5">
                                        <i class="ph ph-question font-bold"></i><span>+ Kuis</span>
                                    </button>
                                </div>
                            ` : ''}
                        </div>

                        <!-- TAB MENU RUANG BELAJAR -->
                        <div class="flex overflow-x-auto space-x-2 border-t pt-4 text-xs font-semibold text-slate-600">
                            <button data-tab="materi" class="tab-ruang px-4 py-2 rounded-xl transition ${currentTabRuang === 'materi' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Materi (${materiList.length})</button>
                            <button data-tab="tugas" class="tab-ruang px-4 py-2 rounded-xl transition ${currentTabRuang === 'tugas' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Tugas (${tugasList.length})</button>
                            <button data-tab="kuis" class="tab-ruang px-4 py-2 rounded-xl transition ${currentTabRuang === 'kuis' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Kuis (${kuisList.length})</button>
                            <button data-tab="presensi" class="tab-ruang px-4 py-2 rounded-xl transition ${currentTabRuang === 'presensi' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Presensi</button>
                            <button data-tab="nilai" class="tab-ruang px-4 py-2 rounded-xl transition ${currentTabRuang === 'nilai' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Nilai</button>
                            <button data-tab="diskusi" class="tab-ruang px-4 py-2 rounded-xl transition ${currentTabRuang === 'diskusi' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Diskusi</button>
                        </div>
                    </div>

                    <!-- MODAL FORM UNGGAH MATERI -->
                    <div id="modal-form-materi" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-primary">
                        <h3 class="font-bold text-slate-900 text-sm">Unggah Media Bahan Ajar (Word, Excel, PPT, Gambar, Video)</h3>
                        <form id="form-add-materi" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div>
                                <label class="block font-bold uppercase mb-1">Judul Materi / Pertemuan</label>
                                <input type="text" id="m-judul" placeholder="Contoh: Modul Pertemuan 1" class="w-full border p-2.5 rounded-xl" required>
                            </div>
                            <div>
                                <label class="block font-bold uppercase mb-1">Format File</label>
                                <select id="m-format" class="w-full border p-2.5 rounded-xl">
                                    <option value="Word">Word (.doc / .docx)</option>
                                    <option value="Excel">Excel (.xls / .xlsx)</option>
                                    <option value="PPT">PowerPoint (.ppt / .pptx)</option>
                                    <option value="Gambar">Gambar (.jpg / .png)</option>
                                    <option value="Video">Video / YouTube</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block font-bold uppercase mb-1">Tautan File (Google Drive / Link URL)</label>
                                <input type="url" id="m-link" placeholder="https://..." class="w-full border p-2.5 rounded-xl" required>
                            </div>
                            <div class="md:col-span-2 flex space-x-2">
                                <button type="submit" class="bg-primary text-white font-bold px-5 py-2.5 rounded-xl shadow hover:bg-red-700">Publikasikan Materi</button>
                                <button type="button" id="batal-materi" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button>
                            </div>
                        </form>
                    </div>

                    <!-- MODAL FORM BUAT TUGAS -->
                    <div id="modal-form-tugas" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-slate-800">
                        <h3 class="font-bold text-slate-900 text-sm">Buat Tugas Baru untuk Siswa</h3>
                        <form id="form-add-tugas" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div class="md:col-span-2">
                                <label class="block font-bold uppercase mb-1">Judul & Instruksi Tugas</label>
                                <input type="text" id="t-judul" placeholder="Contoh: Tugas Mandiri" class="w-full border p-2.5 rounded-xl" required>
                            </div>
                            <div>
                                <label class="block font-bold uppercase mb-1">Tenggat Waktu (Deadline)</label>
                                <input type="text" id="t-deadline" placeholder="Contoh: Senin, 03 Nov 2026, 23:59 WIB" class="w-full border p-2.5 rounded-xl" required>
                            </div>
                            <div class="md:col-span-2 flex space-x-2">
                                <button type="submit" class="bg-slate-900 text-white font-bold px-5 py-2.5 rounded-xl shadow">Simpan Tugas</button>
                                <button type="button" id="batal-tugas" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button>
                            </div>
                        </form>
                    </div>

                    <!-- MODAL FORM BUAT KUIS -->
                    <div id="modal-form-kuis" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-amber-500">
                        <h3 class="font-bold text-slate-900 text-sm">Buat Kuis / CBT Online Baru</h3>
                        <form id="form-add-kuis" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div class="md:col-span-2">
                                <label class="block font-bold uppercase mb-1">Judul Kuis</label>
                                <input type="text" id="k-judul" placeholder="Contoh: Kuis Evaluasi Bab" class="w-full border p-2.5 rounded-xl" required>
                            </div>
                            <div>
                                <label class="block font-bold uppercase mb-1">Durasi Pengerjaan</label>
                                <input type="text" id="k-waktu" placeholder="Contoh: 30 Menit" class="w-full border p-2.5 rounded-xl" required>
                            </div>
                            <div class="md:col-span-2 flex space-x-2">
                                <button type="submit" class="bg-amber-500 text-slate-900 font-bold px-5 py-2.5 rounded-xl shadow">Simpan Kuis</button>
                                <button type="button" id="batal-kuis" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button>
                            </div>
                        </form>
                    </div>

                    <!-- KONTEN UTAMA TAB -->
                    <div id="tab-content"></div>
                </div>
            `;

            document.querySelectorAll('.tab-ruang').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentTabRuang = e.currentTarget.getAttribute('data-tab');
                    renderRuangBelajar(container);
                });
            });

            const bMat = document.getElementById('btn-modal-pertemuan');
            if (bMat) {
                bMat.addEventListener('click', () => document.getElementById('modal-form-materi').classList.toggle('hidden'));
                document.getElementById('batal-materi').addEventListener('click', () => document.getElementById('modal-form-materi').classList.add('hidden'));
                document.getElementById('form-add-materi').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const judul = document.getElementById('m-judul').value;
                    const format = document.getElementById('m-format').value;
                    const link = document.getElementById('m-link').value;
                    const list = getMateriDB();
                    list.unshift({ id: Date.now(), pertemuan: `PERT. ${list.length + 1}`, judul, format, tanggal: 'Hari Ini', hadir: '0/24', link });
                    saveMateriDB(list);
                    alert(`Materi [${format}] berhasil diunggah!`);
                    document.getElementById('modal-form-materi').classList.add('hidden');
                    renderRuangBelajar(container);
                });
            }

            const bTug = document.getElementById('btn-modal-tugas');
            if (bTug) {
                bTug.addEventListener('click', () => document.getElementById('modal-form-tugas').classList.toggle('hidden'));
                document.getElementById('batal-tugas').addEventListener('click', () => document.getElementById('modal-form-tugas').classList.add('hidden'));
                document.getElementById('form-add-tugas').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const list = getTugasDB();
                    list.unshift({ id: Date.now(), judul: document.getElementById('t-judul').value, deadline: document.getElementById('t-deadline').value, status: 'Dibuka' });
                    saveTugasDB(list);
                    alert('Tugas berhasil dibuat!');
                    document.getElementById('modal-form-tugas').classList.add('hidden');
                    renderRuangBelajar(container);
                });
            }

            const bKuis = document.getElementById('btn-modal-kuis');
            if (bKuis) {
                bKuis.addEventListener('click', () => document.getElementById('modal-form-kuis').classList.toggle('hidden'));
                document.getElementById('batal-kuis').addEventListener('click', () => document.getElementById('modal-form-kuis').classList.add('hidden'));
                document.getElementById('form-add-kuis').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const list = getKuisDB();
                    list.unshift({ id: Date.now(), judul: document.getElementById('k-judul').value, waktu: document.getElementById('k-waktu').value, status: 'Sedang dibuka' });
                    saveKuisDB(list);
                    alert('Kuis berhasil dibuat!');
                    document.getElementById('modal-form-kuis').classList.add('hidden');
                    renderRuangBelajar(container);
                });
            }

            renderTabContent();
        }

        function renderTabContent() {
            const tabContent = document.getElementById('tab-content');
            const materiList = getMateriDB();
            const tugasList = getTugasDB();
            const kuisList = getKuisDB();

            if (currentTabRuang === 'materi') {
                tabContent.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 space-y-4">
                            ${materiList.length === 0 ? `
                                <div class="bg-white p-8 rounded-2xl border shadow-sm text-center space-y-2">
                                    <p class="text-sm font-bold text-slate-700">Belum ada materi pembelajaran yang diunggah.</p>
                                    <p class="text-xs text-slate-400">${currentUser.role === 'guru' ? 'Silakan tekan tombol "+ Pertemuan / Materi" di atas untuk mulai mengunggah.' : 'Silakan menunggu guru pengampu mengunggah materi.'}</p>
                                </div>
                            ` : materiList.map(m => `
                                <div class="bg-white p-5 rounded-2xl border shadow-sm flex items-center justify-between">
                                    <div class="flex items-start space-x-4">
                                        <div class="w-12 h-12 rounded-full border-2 border-slate-300 flex items-center justify-center font-bold text-xs bg-slate-50">${m.pertemuan}</div>
                                        <div class="space-y-1">
                                            <div class="flex items-center space-x-2">
                                                <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded">${m.format}</span>
                                            </div>
                                            <h4 class="font-bold text-slate-900 text-sm">${m.judul}</h4>
                                            <p class="text-xs text-slate-500">${m.tanggal}</p>
                                            <span class="inline-block px-2.5 py-0.5 bg-green-100 text-green-700 font-bold text-[10px] rounded-full">✓ Hadir ${m.hadir}</span>
                                        </div>
                                    </div>
                                    <a href="${m.link}" target="_blank" class="text-xs bg-primary text-white font-semibold px-4 py-2 rounded-xl shadow hover:bg-red-700">Akses File</a>
                                </div>
                            `).join('')}
                        </div>

                        <!-- CATATAN & JADWAL KELAS DARING -->
                        <div class="space-y-6">
                            <div class="bg-white p-5 rounded-2xl border-l-4 border-primary shadow-sm space-y-2">
                                <h4 class="font-bold text-slate-900 text-sm">Catatan guru</h4>
                                <p class="text-xs text-slate-600 leading-relaxed">
                                    Selamat datang di kelas PJJ SMK Taruna Harapan 2.<br><br>
                                    Setiap pertemuan: baca materi, tekan <b>Saya hadir</b> saat presensi dibuka, lalu kerjakan latihan. Tugas dikumpulkan paling lambat pukul 23.59 di hari tenggat.<br><br>
                                    Buku pegangan: Kurikulum Merdeka.
                                </p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
                                <h4 class="font-bold text-slate-900 text-sm flex items-center space-x-2">
                                    <i class="ph ph-video-camera text-primary"></i><span>Jadwal kelas daring</span>
                                </h4>
                                <div class="p-3 bg-slate-50 border rounded-xl space-y-1 text-xs">
                                    <p class="font-bold text-slate-800">Senin - Jumat, Sesuai Sesi</p>
                                    <a href="https://meet.google.com/894-3dfe-cb7" target="_blank" class="text-blue-600 underline truncate block">https://meet.google.com/894-3dfe-cb7</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTabRuang === 'tugas') {
                tabContent.innerHTML = `
                    <div class="max-w-4xl mx-auto space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Daftar Tugas & Pengumpulan Siswa</h3>
                        ${tugasList.length === 0 ? `
                            <div class="bg-white p-8 rounded-2xl border shadow-sm text-center space-y-2">
                                <p class="text-sm font-bold text-slate-700">Belum ada tugas yang diberikan.</p>
                                <p class="text-xs text-slate-400">${currentUser.role === 'guru' ? 'Silakan buat tugas baru menggunakan tombol "+ Tugas" di atas.' : 'Belum ada tugas aktif dari guru.'}</p>
                            </div>
                        ` : tugasList.map(t => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded">${t.status}</span>
                                    <h4 class="font-bold text-slate-900 text-sm">${t.judul}</h4>
                                    <p class="text-xs text-slate-500">Tenggat: ${t.deadline}</p>
                                </div>
                                <div class="w-full md:w-auto flex flex-col sm:flex-row items-center gap-2">
                                    ${currentUser.role === 'siswa' ? `
                                        <input type="file" id="file-tugas-${t.id}" class="text-xs border p-2 rounded-xl bg-slate-50">
                                        <button onclick="alert('File tugas berhasil dikumpulkan ke guru!')" class="bg-primary text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow hover:bg-red-700 w-full sm:w-auto">Kumpulkan Tugas</button>
                                    ` : `
                                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl">Status: Menunggu Pengumpulan Siswa</span>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'kuis') {
                tabContent.innerHTML = `
                    <div class="max-w-4xl mx-auto space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Kuis & Ujian CBT Online</h3>
                        ${kuisList.length === 0 ? `
                            <div class="bg-white p-8 rounded-2xl border shadow-sm text-center space-y-2">
                                <p class="text-sm font-bold text-slate-700">Belum ada kuis atau ujian online.</p>
                                <p class="text-xs text-slate-400">${currentUser.role === 'guru' ? 'Silakan buat kuis baru menggunakan tombol "+ Kuis" di atas.' : 'Belum ada kuis aktif.'}</p>
                            </div>
                        ` : kuisList.map(k => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex justify-between items-center">
                                <div class="space-y-1">
                                    <span class="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-0.5 rounded">${k.status}</span>
                                    <h4 class="font-bold text-slate-900 text-sm">${k.judul}</h4>
                                    <p class="text-xs text-slate-500">Durasi: ${k.waktu}</p>
                                </div>
                                <button onclick="alert('Mulai mengerjakan kuis...')" class="bg-primary text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow hover:bg-red-700">Kerjakan Kuis</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'presensi') {
                tabContent.innerHTML = `
                    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Presensi Kehadiran PJJ</h3>
                        <p class="text-xs text-slate-500">Catat kehadiran Anda hari ini.</p>
                        <button onclick="alert('Presensi berhasil dicatat!')" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-green-700">Saya Hadir</button>
                    </div>
                `;
            } else if (currentTabRuang === 'diskusi') {
                tabContent.innerHTML = `
                    <div class="max-w-4xl mx-auto bg-white rounded-2xl border shadow-sm flex flex-col h-[500px]">
                        <div class="p-4 border-b font-bold text-slate-900 text-sm flex items-center space-x-2">
                            <i class="ph ph-chats text-primary text-lg"></i><span>Forum Diskusi Real-Time</span>
                        </div>
                        <div class="flex-1 p-5 overflow-y-auto space-y-3 text-xs">
                            ${diskusiList.map(d => `
                                <div class="p-3 rounded-xl bg-slate-50 border">
                                    <div class="flex justify-between items-center mb-1"><span class="font-bold text-primary">${d.pengirim}</span><span class="text-[10px] text-slate-400">${d.waktu}</span></div>
                                    <p class="text-slate-800">${d.pesan}</p>
                                </div>
                            `).join('')}
                        </div>
                        <form id="form-chat" class="p-4 border-t flex space-x-2 bg-slate-50 rounded-b-2xl">
                            <input type="text" id="chat-msg" placeholder="Tulis pesan diskusi..." class="flex-1 border rounded-xl p-3 text-xs focus:outline-none focus:border-primary bg-white" required>
                            <button type="submit" class="bg-primary text-white font-bold px-5 py-3 rounded-xl text-xs shadow">Kirim</button>
                        </form>
                    </div>
                `;
                document.getElementById('form-chat').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const inp = document.getElementById('chat-msg');
                    diskusiList.push({ pengirim: `${currentUser.nama} (${currentUser.role})`, pesan: inp.value, waktu: 'Baru saja' });
                    renderRuangBelajar(document.getElementById('main-view'));
                });
            } else {
                tabContent.innerHTML = `<div class="bg-white p-8 rounded-2xl border shadow-sm text-center"><p class="text-xs text-slate-500">Modul ${currentTabRuang} aktif.</p></div>`;
            }
        }

        renderLogin();
    </script>
</body>
</html>
