        async function fetchDataFromSupabase() {
            let mData = [], tData = [], kData = [], pData = [], pengData = [], chatData = [], subData = [], kuisSubData = [];
            try {
                const resM = await supabase.from('materi').select('*');
                if (resM.data) mData = resM.data;
                const resT = await supabase.from('tugas').select('*');
                if (resT.data) tData = resT.data;
                const resK = await supabase.from('kuis').select('*');
                if (resK.data) kData = resK.data;
                const resP = await supabase.from('presensi').select('*');
                if (resP.data) pData = resP.data;
                const resPeng = await supabase.from('pengumuman').select('*');
                if (resPeng.data) pengData = resPeng.data;
                const resChat = await supabase.from('chat_kelas').select('*');
                if (resChat.data) chatData = resChat.data;
                const resSub = await supabase.from('submissions').select('*');
                if (resSub.data) subData = resSub.data;
                const resKuisSub = await supabase.from('kuis_submissions').select('*');
                if (resKuisSub.data) kuisSubData = resKuisSub.data;
            } catch (err) {}

            return {
                materi: mData.length > 0 ? mData : JSON.parse(localStorage.getItem('th2_materi_v12') || '[]'),
                tugas: tData.length > 0 ? tData : JSON.parse(localStorage.getItem('th2_tugas_v12') || '[]'),
                kuis: kData.length > 0 ? kData : JSON.parse(localStorage.getItem('th2_kuis_v12') || '[]'),
                presensi: pData.length > 0 ? pData : JSON.parse(localStorage.getItem('th2_presensi_v12') || '[]'),
                pengumuman: pengData.length > 0 ? pengData : JSON.parse(localStorage.getItem('th2_pengumuman_v12') || '[{"judul": "Selamat Datang PJJ", "isi": "Portal PJJ aktif.", "waktu": "Hari Ini"}]'),
                chat: chatData.length > 0 ? chatData : JSON.parse(localStorage.getItem('th2_chat_v12') || '[]'),
                submissions: subData.length > 0 ? subData : JSON.parse(localStorage.getItem('th2_submissions_v12') || '[]'),
                kuisSubmissions: kuisSubData.length > 0 ? kuisSubData : JSON.parse(localStorage.getItem('th2_kuis_sub_v12') || '[]')
            };
        }

        async function saveCloud(table, newItem) {
            let local = JSON.parse(localStorage.getItem(`th2_${table}_v12`) || '[]');
            local.unshift(newItem);
            localStorage.setItem(`th2_${table}_v12`, JSON.stringify(local));
            try { await supabase.from(table).insert([newItem]); } catch (e) {}
        }

                document.getElementById('batal-kuis').addEventListener('click', () => document.getElementById('modal-form-kuis').classList.add('hidden'));
                document.getElementById('form-add-kuis').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const fileObj = await convertFileToBase64('k-file');
                    const linkUrl = document.getElementById('k-link').value;

                    const newItem = { 
                        id: Date.now(), 
                        judul: document.getElementById('k-judul').value, 
                        waktu: document.getElementById('k-waktu').value, 
                        link: fileObj ? fileObj.data : linkUrl,
                        fileName: fileObj ? fileObj.name : '',
                        isFile: !!fileObj,
                        soalTemplate: document.getElementById('k-soal-template').value,
                        targetKelas: document.getElementById('k-kelas').value,
                        status: 'Dibuka',
                        guru: currentUser.nama
                    };
                    await saveCloud('kuis', newItem);
                    alert('Kuis / CBT berhasil dibuat!');
                    renderRuangBelajar(container);
                });
            }

            renderTabContent(materiList, tugasList, kuisList, chatList);
        }

        function renderTabContent(materiList, tugasList, kuisList, chatList) {
            const tabContent = document.getElementById('tab-content');

            if (currentTabRuang === 'materi') {
                tabContent.innerHTML = `
                    <div class="space-y-4">
                        ${materiList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada materi untuk kelas Anda.</p></div>' : materiList.map(m => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded">${m.format}</span>
                                        <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-0.5 rounded">${m.mapel || 'Mapel Umum'}</span>
                                        <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">Kelas: ${m.targetKelas || 'Semua Kelas'}</span>
                                    </div>
                                    <h4 class="font-bold text-slate-900 text-sm">${m.judul}</h4>
                                    <p class="text-xs text-slate-500">Pengajar: ${m.guru || 'Guru'} • ${m.tanggal}</p>
                                </div>
                                <a href="${m.link}" target="_blank" class="text-xs bg-primary text-white font-semibold px-4 py-2 rounded-xl shadow hover:bg-red-700 flex items-center space-x-1">
                                    <i class="ph ph-download text-sm"></i><span>Akses / Unduh File (${m.fileName || 'Link'})</span>
                                </a>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'tugas') {
                tabContent.innerHTML = `
                    <div class="space-y-4">
                        ${tugasList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada tugas untuk kelas Anda.</p></div>' : tugasList.map(t => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">Kelas: ${t.targetKelas || 'Semua Kelas'}</span>
                                    <h4 class="font-bold text-slate-900 text-sm">${t.judul}</h4>
                                    <p class="text-xs text-slate-500">Guru: ${t.guru} • Tenggat: ${t.deadline}</p>
                                    ${t.link ? `<a href="${t.link}" target="_blank" class="text-xs text-blue-600 underline font-semibold block mt-1">📁 Lihat Soal / Petunjuk (${t.fileName || 'Link'})</a>` : ''}
                                </div>
                                <div>
                                    ${currentUser.role === 'siswa' ? `
                                        <div class="bg-slate-50 p-3 border rounded-xl space-y-2 w-72">
                                            <p class="text-[11px] font-bold text-slate-700">Form Pengumpulan Tugas:</p>
                                            <textarea id="jawaban-teks-${t.id}" placeholder="Ketik jawaban teks di sini..." class="w-full border p-2 rounded-lg text-xs h-16 bg-white"></textarea>
                                            <input type="file" id="jawaban-file-${t.id}" accept="image/jpeg,image/png,.pdf,.doc,.docx,.xls,.xlsx" class="w-full text-[10px] bg-white border p-1 rounded-lg">
                                            <button onclick="kirimTugas('${t.judul.replace(/'/g, "\\'")}', '${t.id}')" class="w-full bg-primary hover:bg-red-700 text-white font-bold py-2 rounded-lg text-xs shadow">Kumpulkan Tugas</button>
                                        </div>
                                    ` : `<span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl">Tugas Aktif</span>`}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'kuis') {
                tabContent.innerHTML = `
                    <div class="space-y-4">
                        ${kuisList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada kuis untuk kelas Anda.</p></div>' : kuisList.map(k => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">Kelas: ${k.targetKelas || 'Semua Kelas'}</span>
                                    <h4 class="font-bold text-slate-900 text-sm">${k.judul}</h4>
                                    <p class="text-xs text-slate-500">Guru: ${k.guru} • Durasi: ${k.waktu}</p>
                                    ${k.isFile ? `<a href="${k.link}" target="_blank" class="text-xs text-green-600 underline font-semibold block mt-1">📁 Unduh File Soal (${k.fileName})</a>` : (k.link ? `<a href="${k.link}" target="_blank" class="text-xs text-blue-600 underline font-semibold block mt-1">🔗 Buka Link Kuis Eksternal</a>` : '')}
                                </div>
                                <div>
                                    ${currentUser.role === 'siswa' ? `
                                        <button onclick="bukaModalKerjakanKuis('${k.judul.replace(/'/g, "\\'")}', \`${encodeURIComponent(k.soalTemplate || '')}\`)" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2.5 rounded-xl text-xs shadow">Kerjakan Kuis Sekarang</button>
                                    ` : `<span class="text-xs font-bold text-amber-800 bg-amber-50 px-3 py-1.5 rounded-xl">Kuis Aktif</span>`}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'presensi') {
                tabContent.innerHTML = `
                    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Presensi Kehadiran PJJ</h3>
                        <button onclick="saveCloud('presensi', {nama: currentUser.nama, kelas: currentUser.kelas, waktu: new Date().toLocaleTimeString() + ' WIB'}); alert('Kehadiran berhasil dicatat!'); location.reload();" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-green-700">Saya Hadir (Absen)</button>
                    </div>
                `;
            } else if (currentTabRuang === 'chat') {
                tabContent.innerHTML = `
                    <div class="bg-white rounded-2xl border shadow-sm flex flex-col h-[500px]">
                        <div class="p-4 border-b font-bold text-slate-900 text-sm">💬 Forum Diskusi Chat Kelas (${currentUser.kelas || 'Umum'})</div>
                        <div class="flex-1 p-5 overflow-y-auto space-y-3 text-xs">
                            ${chatList.length === 0 ? '<p class="text-slate-400 text-center">Belum ada percakapan di kelas ini.</p>' : chatList.map(c => `
                                <div class="p-3 rounded-xl bg-slate-50 border">
                                    <div class="flex justify-between items-center mb-1"><span class="font-bold text-primary">${c.pengirim}</span><span class="text-[10px] text-slate-400">${c.waktu}</span></div>
                                    <p class="text-slate-800">${c.pesan}</p>
                                </div>
                            `).join('')}
                        </div>
                        <form id="form-chat" class="p-4 border-t flex space-x-2 bg-slate-50 rounded-b-2xl">
                            <input type="text" id="chat-msg" placeholder="Tulis pesan ke kelas..." class="flex-1 border rounded-xl p-3 text-xs focus:outline-none focus:border-primary bg-white" required>
                            <button type="submit" class="bg-primary text-white font-bold px-5 py-3 rounded-xl text-xs shadow">Kirim</button>
                        </form>
                    </div>
                `;
                document.getElementById('form-chat').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const pesan = document.getElementById('chat-msg').value;
                    await saveCloud('chat_kelas', {
                        pengirim: `${currentUser.nama} (${currentUser.role})`,
                        kelas: currentUser.kelas || 'Umum',
                        pesan,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    });
                    renderRuangBelajar(container);
                });
            }
        }

        // Global function untuk siswa mengerjakan kuis interaktif
        window.bukaModalKerjakanKuis = function(judulKuis, encodedTemplate) {
            const templateSoal = decodeURIComponent(encodedTemplate);
            const modalDiv = document.createElement('div');
            modalDiv.className = 'fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-y-auto';
            modalDiv.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-bold text-base text-slate-900">Ujian CBT: ${judulKuis}</h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>
                    </div>
                    <div class="space-y-3 text-xs">
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <p class="font-bold text-slate-700 mb-1">Soal Kuis:</p>
                            <pre class="whitespace-pre-wrap font-sans text-slate-800">${templateSoal}</pre>
                        </div>
                        <div>
                            <label class="block font-bold uppercase mb-1">Lembar Jawaban Anda (Ketik jawaban PG, Benar/Salah, Menjodohkan, Uraian):</label>
                            <textarea id="input-jawaban-kuis" rows="8" placeholder="Contoh: 1.A, 2.B, 6.Benar, 11.1-C, 16.Pembahasan..." class="w-full border p-3 rounded-xl text-xs bg-white" required></textarea>
                        </div>
                        <div>
                            <label class="block font-bold uppercase mb-1">Atau Upload File Jawaban (Opsional - JPG/PDF)</label>
                            <input type="file" id="file-jawaban-kuis" accept="image/*,.pdf,.doc,.docx" class="w-full border p-2 rounded-xl bg-slate-50">
                        </div>
                    </div>
                    <div class="flex justify-end space-x-2 pt-2 border-t">
                        <button onclick="this.closest('.fixed').remove()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs">Batal</button>
                        <button onclick="kirimJawabanKuis('${judulKuis.replace(/'/g, "\\'")}')" class="bg-primary hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow">Kirim Jawaban Kuis</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);
        }

        window.kirimJawabanKuis = async function(judulKuis) {
            const jawabanTeks = document.getElementById('input-jawaban-kuis').value.trim();
            const fileInput = document.getElementById('file-jawaban-kuis');

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const submission = {
                        id: Date.now(),
                        namaSiswa: currentUser.nama,
                        kelas: currentUser.kelas,
                        judulKuis: judulKuis,
                        jawabanRekap: `File: ${file.name}\nTeks: ${jawabanTeks || '-'}`,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    };
                    await saveCloud('kuis_submissions', submission);
                    alert('Jawaban kuis beserta file berhasil dikumpulkan!');
                    document.querySelector('.fixed').remove();
                    location.reload();
                };
                reader.readAsDataURL(file);
                return;
            }

            if (!jawabanTeks) {
                alert('Harap isi lembar jawaban kuis Anda terlebih dahulu!');
                return;
            }

            const submission = {
                id: Date.now(),
                namaSiswa: currentUser.nama,
                kelas: currentUser.kelas,
                judulKuis: judulKuis,
                jawabanRekap: jawabanTeks,
                waktu: new Date().toLocaleTimeString() + ' WIB'
            };
            await saveCloud('kuis_submissions', submission);
            alert('Jawaban kuis berhasil dikumpulkan!');
            document.querySelector('.fixed').remove();
            location.reload();
        }

        window.kirimTugas = async function(judulTugas, tugasId) {
            const teks = document.getElementById(`jawaban-teks-${tugasId}`).value.trim();
            const fileInput = document.getElementById(`jawaban-file-${tugasId}`);

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const submission = {
                        id: Date.now(),
                        namaSiswa: currentUser.nama,
                        kelas: currentUser.kelas,
                        judulTugas: judulTugas,
                        jawaban: e.target.result,
                        isFile: true,
                        fileName: file.name,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    };
                    await saveCloud('submissions', submission);
                    alert('Tugas beserta file berhasil dikumpulkan!');
                    location.reload();
                };
                reader.readAsDataURL(file);
                return;
            }

            if (!teks) {
                alert('Harap isi jawaban teks atau lampirkan file tugas terlebih dahulu!');
                return;
            }

            const submission = {
                id: Date.now(),
                namaSiswa: currentUser.nama,
                kelas: currentUser.kelas,
                judulTugas: judulTugas,
                jawaban: teks,
                isFile: false,
                waktu: new Date().toLocaleTimeString() + ' WIB'
            };
            await saveCloud('submissions', submission);
            alert('Jawaban tugas teks berhasil dikumpulkan!');
            location.reload();
        }

        renderLogin();
    </script>
</body>
</html>
