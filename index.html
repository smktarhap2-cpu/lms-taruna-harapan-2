        async function getData(table) {
            const { data, error } = await _supabase.from(table).select('*').order('id', { ascending: false });
            if (error) { console.error(`Gagal ambil ${table}:`, error); return []; }
            return data || [];
        }

        async function saveData(table, newItem) {
            delete newItem.id;
            const { error } = await _supabase.from(table).insert([newItem]);
            if (error) {
                console.error(`Gagal simpan ke ${table}:`, error);
                alert('Gagal ke Server: ' + error.message);
            } else {
                alert('Berhasil disimpan ke server cloud!');
            }
        }

window.prosesSimpanTugas = async function() {
    try {
        const mapel = document.getElementById('t-mapel')?.value;
        const kelas = document.getElementById('t-kelas')?.value;
        const judul = document.getElementById('t-judul')?.value;
        const deadline = document.getElementById('t-deadline')?.value;
        const instruksi = document.getElementById('t-instruksi')?.value;
        const fileInput = document.getElementById('t-file');

        if (!judul || !mapel) {
            alert('Mohon isi Judul dan Mata Pelajaran terlebih dahulu!');
            return;
        }

        let fileUrl = '';
        let fileNama = '';

        if (fileInput && fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            fileNama = file.name;
            const filePath = `tugas/${Date.now()}_${file.name}`;
            
            const { error: uploadError } = await supabase.storage.from('materi').upload(filePath, file);
            if (uploadError) throw uploadError;
            
            const { data: publicUrlData } = supabase.storage.from('materi').getPublicUrl(filePath);
            fileUrl = publicUrlData.publicUrl;
        }

        await saveData('tugas', {
            mapel: mapel,
            kelas: kelas,
            judul: judul,
            deadline: deadline,
            instruksi: instruksi,
            fileNama: fileNama,
            fileUrl: fileUrl,
            guru: currentUser.nama
        });

        alert('Tugas berhasil disimpan!');
        if (typeof renderActiveView === 'function') renderActiveView();
    } catch (err) {
        alert('Gagal menyimpan tugas: ' + err.message);
        console.error(err);
    }
};
