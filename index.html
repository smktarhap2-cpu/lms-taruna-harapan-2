        // Fungsi Database Cloud Supabase dengan Penanganan Error Detail
        async function getData(table) {
            const { data, error } = await _supabase.from(table).select('*').order('id', { ascending: false });
            if (error) { console.error(`Gagal ambil ${table}:`, error); return []; }
            return data || [];
        }

        async function saveData(table, newItem) {
            delete newItem.id;
            const { error } = await _supabase.from(table).insert([newItem]);
            if (error) {
                console.error(`Gagal simpan ke ${table}:`, error);
                alert('Gagal ke Server: ' + error.message);
            } else {
                alert('Berhasil disimpan ke server cloud!');
            }
        }

        async function removeData(table, id) {
            const { error } = await _supabase.from(table).delete().eq('id', Number(id));
            if (error) console.error(error);
        }

                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-lg text-slate-900">Dashboard Monitoring Upload Guru</h3></div>
                    <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-100 text-slate-600 border-b">
                                <tr><th class="p-3">No</th><th class="p-3">Nama Guru</th><th class="p-3">Mata Pelajaran</th><th class="p-3 text-center">Materi</th><th class="p-3 text-center">Tugas</th><th class="p-3 text-center">Kuis</th></tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200">
                                ${masterGuruLogin.map((g, idx) => {
                                    const kw = g.nama.split(',')[0].trim().toLowerCase();
                                    const hasM = materiList.some(m => (m.guru || '').toLowerCase().includes(kw));
                                    const hasT = tugasList.some(t => (t.guru || '').toLowerCase().includes(kw));
                                    const hasK = kuisList.some(k => (k.guru || '').toLowerCase().includes(kw));
                                    return `
                                        <tr class="hover:bg-slate-50">
                                            <td class="p-3">${idx + 1}</td><td class="p-3 font-bold">${g.nama}</td><td class="p-3 text-slate-600">${g.mapels.join(', ')}</td>
                                            <td class="p-3 text-center">${hasM ? '<span class="bg-green-100 text-green-800 px-2 py-1 rounded-full font-bold">Sudah</span>' : '<span class="bg-red-100 text-red-700 px-2 py-1 rounded-full">Belum</span>'}</td>
                                            <td class="p-3 text-center">${hasT ? '<span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-bold">Sudah</span>' : '<span class="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">Belum</span>'}</td>
                                            <td class="p-3 text-center">${hasK ? '<span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-bold">Sudah</span>' : '<span class="bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">Belum</span>'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        async function renderPengumumanView(container) {
            const listPeng = await getData('pengumuman');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-lg text-slate-900">Pengumuman Sekolah</h3></div>
                    ${currentUser.role === 'admin' ? `
                        <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-primary">
                            <form id="form-pengumuman" class="space-y-3 text-xs">
                                <input type="text" id="p-judul" placeholder="Judul" class="w-full border p-2.5 rounded-xl" required>
                                <textarea id="p-isi" placeholder="Isi..." class="w-full border p-2.5 rounded-xl h-24" required></textarea>
                                <button type="submit" class="bg-primary text-white font-bold px-5 py-2.5 rounded-xl shadow">Siarkan</button>
                            </form>
                        </div>
                    ` : ''}
                    <div class="space-y-3">
                        ${listPeng.map(p => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-1">
                                <h4 class="font-bold text-sm text-slate-900">${p.judul}</h4><p class="text-xs text-slate-600">${p.isi}</p><p class="text-[10px] text-slate-400 mt-2">${p.waktu}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            const formP = document.getElementById('form-pengumuman');
            if (formP) {
                formP.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await saveData('pengumuman', {
                        judul: document.getElementById('p-judul').value,
                        isi: document.getElementById('p-isi').value,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    });
                    renderActiveView();
                    muatBannerPengumuman();
                });
            }
        }

        async function renderRuangBelajar(container) {
            const materiList = await getData('materi');
            const tugasList = await getData('tugas');
            const kuisList = await getData('kuis');
            const chatList = (await getData('chat_kelas')).filter(c => currentUser.role === 'admin' || currentUser.role === 'kepsek' || currentUser.role === 'guru' || c.kelas === currentUser.kelas);
            const isPrivileged = currentUser.role === 'admin' || currentUser.role === 'kepsek' || currentUser.role === 'guru';

            container.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <p class="text-xs text-slate-400 font-medium mb-1">Ruang Pembelajaran Cloud</p>
                                <h1 class="text-2xl font-bold text-slate-900">${currentUser.role === 'guru' ? 'Pengampu: ' + currentUser.mapel : 'Kelas: ' + (currentUser.kelas || 'Semua Kelas')}</h1>
                            </div>
                            ${isPrivileged ? `
                                <div class="flex flex-wrap gap-2">
                                    <button onclick="toggleModal('modal-form-materi')" class="bg-primary text-white font-bold px-4 py-2 rounded-xl text-xs shadow">+ Materi</button>
                                    <button onclick="toggleModal('modal-form-tugas')" class="bg-slate-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">+ Tugas</button>
                                    <button onclick="toggleModal('modal-form-kuis')" class="bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-xl text-xs shadow">+ Kuis</button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="flex overflow-x-auto space-x-2 border-t pt-4 text-xs font-semibold text-slate-600">
                            <button onclick="switchTab('materi')" class="tab-btn px-4 py-2 rounded-xl transition ${currentTabRuang === 'materi' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Materi (${materiList.length})</button>
                            <button onclick="switchTab('tugas')" class="tab-btn px-4 py-2 rounded-xl transition ${currentTabRuang === 'tugas' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Tugas (${tugasList.length})</button>
                            <button onclick="switchTab('kuis')" class="tab-btn px-4 py-2 rounded-xl transition ${currentTabRuang === 'kuis' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Kuis (${kuisList.length})</button>
                            <button onclick="switchTab('presensi')" class="tab-btn px-4 py-2 rounded-xl transition ${currentTabRuang === 'presensi' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">Presensi</button>
                            <button onclick="switchTab('diskusi')" class="tab-btn px-4 py-2 rounded-xl transition ${currentTabRuang === 'diskusi' ? 'bg-amber-400 text-slate-900 font-bold shadow' : 'hover:bg-slate-100'}">💬 Diskusi Q&A</button>
                        </div>
                    </div>

                    <!-- MODAL MATERI -->
                    <div id="modal-form-materi" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-primary">
                        <h3 class="font-bold text-slate-900 text-sm">Publikasi Materi</h3>
                        <form id="form-add-materi" class="space-y-3 text-xs">
                            <input type="text" id="m-judul" placeholder="Judul" class="w-full border p-2.5 rounded-xl" required>
                            <input type="url" id="m-youtube" placeholder="Link YouTube (Opsional)" class="w-full border p-2.5 rounded-xl">
                            <textarea id="m-teks" placeholder="Isi Materi..." class="w-full border p-2.5 rounded-xl h-20" required></textarea>
                            <div class="flex space-x-2"><button type="submit" class="bg-primary text-white font-bold px-5 py-2.5 rounded-xl shadow">Simpan</button><button type="button" onclick="toggleModal('modal-form-materi')" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button></div>
                        </form>
                    </div>

                    <!-- MODAL TUGAS -->
                    <div id="modal-form-tugas" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-slate-800">
                        <h3 class="font-bold text-slate-900 text-sm">Buat Tugas</h3>
                        <form id="form-add-tugas" class="space-y-3 text-xs">
                            <input type="text" id="t-judul" placeholder="Judul" class="w-full border p-2.5 rounded-xl" required>
                            <input type="text" id="t-deadline" placeholder="Deadline (Contoh: Besok, 23:59)" class="w-full border p-2.5 rounded-xl" required>
                            <textarea id="t-instruksi" placeholder="Instruksi..." class="w-full border p-2.5 rounded-xl h-16" required></textarea>
                            <div class="flex space-x-2"><button type="submit" class="bg-slate-900 text-white font-bold px-5 py-2.5 rounded-xl shadow">Simpan</button><button type="button" onclick="toggleModal('modal-form-tugas')" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button></div>
                        </form>
                    </div>

                    <!-- MODAL KUIS -->
                    <div id="modal-form-kuis" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4 border-l-4 border-amber-500">
                        <h3 class="font-bold text-slate-900 text-sm">Buat Kuis</h3>
                        <form id="form-add-kuis" class="space-y-3 text-xs">
                            <input type="text" id="k-judul" placeholder="Judul Kuis" class="w-full border p-2.5 rounded-xl" required>
                            <input type="text" id="k-waktu" placeholder="Durasi (Contoh: 30 Menit)" class="w-full border p-2.5 rounded-xl" required>
                            <div class="flex space-x-2"><button type="submit" class="bg-amber-500 text-slate-900 font-bold px-5 py-2.5 rounded-xl shadow">Simpan</button><button type="button" onclick="toggleModal('modal-form-kuis')" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl">Batal</button></div>
                        </form>
                    </div>

                    <div id="tab-content"></div>
                </div>
            `;

            window.switchTab = function(tabName) { currentTabRuang = tabName; renderRuangBelajar(container); };
            window.toggleModal = function(modalId) { document.getElementById(modalId).classList.toggle('hidden'); };

            await renderTabRuangContent(materiList, tugasList, kuisList, chatList, isPrivileged);
        }

        async function renderTabRuangContent(materiList, tugasList, kuisList, chatList, isPrivileged) {
            const content = document.getElementById('tab-content');
            if (currentTabRuang === 'materi') {
                content.innerHTML = `
                    <div class="space-y-4">
                        ${materiList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada materi.</p></div>' : materiList.map(m => `
                            <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
                                <h4 class="font-bold text-slate-900 text-base">${m.judul}</h4><p class="text-xs text-slate-700">${m.teks}</p>
                                ${isPrivileged ? `<button onclick="hapusCloud('materi', ${m.id})" class="text-xs text-red-600 font-bold">Hapus</button>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'tugas') {
                content.innerHTML = `
                    <div class="space-y-4">
                        ${tugasList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada tugas.</p></div>' : tugasList.map(t => `
                            <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
                                <h4 class="font-bold text-slate-900 text-base">${t.judul}</h4><p class="text-xs text-slate-700">${t.instruksi}</p>
                                ${currentUser.role === 'siswa' ? `
                                    <div class="bg-slate-50 p-4 border rounded-xl space-y-2 mt-3">
                                        <textarea id="jawab-${t.id}" placeholder="Tulis jawaban..." class="w-full border p-2 rounded-lg text-xs h-16 bg-white"></textarea>
                                        <button onclick="kirimTugasCloud('${t.judul.replace(/'/g, "\\'")}', '${t.id}')" class="bg-primary text-white font-bold px-4 py-2 rounded-xl text-xs shadow">Kumpulkan</button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'kuis') {
                content.innerHTML = `
                    <div class="space-y-4">
                        ${kuisList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada kuis.</p></div>' : kuisList.map(k => `
                            <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
                                <h4 class="font-bold text-slate-900 text-base">${k.judul}</h4>
                                <button onclick="alert('Mulai Kuis')" class="bg-amber-500 text-slate-900 font-bold px-5 py-2.5 rounded-xl text-xs shadow">Kerjakan</button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'presensi') {
                content.innerHTML = `
                    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Presensi Daring Cloud</h3>
                        <button onclick="kirimAbsenCloud()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-sm shadow">Klik Untuk Hadir</button>
                    </div>
                `;
            } else if (currentTabRuang === 'diskusi') {
                content.innerHTML = `
                    <div class="bg-white rounded-2xl border shadow-sm flex flex-col h-[400px]">
                        <div class="p-4 border-b font-bold text-slate-900 text-sm">💬 Diskusi Q&A</div>
                        <div class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                            ${chatList.map(c => `<div class="p-3 rounded-xl bg-slate-50 border"><span class="font-bold text-primary">${c.pengirim}:</span> ${c.pesan}</div>`).join('')}
                        </div>
                        <form id="form-diskusi" class="p-3 border-t flex space-x-2 bg-slate-50 rounded-b-2xl">
                            <input type="text" id="diskusi-msg" placeholder="Pesan..." class="flex-1 border rounded-xl p-3 text-xs bg-white" required>
                            <button type="submit" class="bg-primary text-white font-bold px-5 py-3 rounded-xl text-xs shadow">Kirim</button>
                        </form>
                    </div>
                `;
                document.getElementById('form-diskusi').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await saveData('chat_kelas', {
                        pengirim: `${currentUser.nama} (${currentUser.role})`,
                        kelas: currentUser.kelas || 'Umum',
                        pesan: document.getElementById('diskusi-msg').value,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    });
                    renderActiveView();
                });
            }
        }

        window.hapusCloud = async function(table, id) {
            await removeData(table, id);
            renderActiveView();
        }

        window.kirimAbsenCloud = async function() {
            await saveData('presensi', {
                nama: currentUser.nama,
                kelas: currentUser.kelas,
                mapel: currentUser.mapel || 'Pelajaran Umum',
                waktu: new Date().toLocaleTimeString() + ' WIB'
            });
        }

        window.kirimTugasCloud = async function(judul, tId) {
            const jawab = document.getElementById(`jawab-${tId}`).value;
            await saveData('submissions', {
                namaSiswa: currentUser.nama,
                kelas: currentUser.kelas,
                judulTugas: judul,
                jawaban: jawab,
                waktu: new Date().toLocaleTimeString() + ' WIB'
            });
            renderActiveView();
        }

        document.addEventListener('submit', async (e) => {
            if (e.target && e.target.id === 'form-add-materi') {
                e.preventDefault();
                await saveData('materi', {
                    judul: document.getElementById('m-judul').value,
                    youtube: document.getElementById('m-youtube').value,
                    teks: document.getElementById('m-teks').value,
                    file: '',
                    guru: currentUser.nama
                });
                renderActiveView();
            } else if (e.target && e.target.id === 'form-add-tugas') {
                e.preventDefault();
                await saveData('tugas', {
                    judul: document.getElementById('t-judul').value,
                    deadline: document.getElementById('t-deadline').value,
                    instruksi: document.getElementById('t-instruksi').value,
                    guru: currentUser.nama
                });
                renderActiveView();
            } else if (e.target && e.target.id === 'form-add-kuis') {
                e.preventDefault();
                await saveData('kuis', {
                    judul: document.getElementById('k-judul').value,
                    waktu: document.getElementById('k-waktu').value,
                    guru: currentUser.nama
                });
                renderActiveView();
            }
        });

        renderLogin();
    </script>
</body>
</html>
