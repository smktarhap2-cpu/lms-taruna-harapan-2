                localStorage.setItem('smk_th2_materi', JSON.stringify(initial));

            } else if (currentTabRuang === 'presensi') {
                tabContent.innerHTML = `
                    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Form Presensi Daring Hari Ini (Jumat)</h3>
                        <p class="text-xs text-slate-500">Silakan lakukan presensi kehadiran untuk mata pelajaran PAI & Karakter.</p>
                        <button id="btn-hadir" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-green-700">Saya Hadir</button>
                    </div>
                `;
                document.getElementById('btn-hadir').addEventListener('click', () => {
                    alert('Presensi Anda berhasil dicatat ke sistem!');
                });
            } else if (currentTabRuang === 'diskusi') {
                tabContent.innerHTML = `
                    <div class="max-w-4xl mx-auto bg-white rounded-2xl border shadow-sm flex flex-col h-[500px]">
                        <div class="p-4 border-b font-bold text-slate-900 text-sm flex items-center space-x-2">
                            <i class="ph ph-chats text-primary text-lg"></i>
                            <span>Forum Diskusi Pembelajaran (Real-Time)</span>
                        </div>
                        <div id="chat-box" class="flex-1 p-5 overflow-y-auto space-y-3 text-xs">
                            ${diskusiList.map(d => `
                                <div class="p-3 rounded-xl bg-slate-50 border">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="font-bold text-primary">${d.pengirim}</span>
                                        <span class="text-[10px] text-slate-400">${d.waktu}</span>
                                    </div>
                                    <p class="text-slate-800 leading-relaxed">${d.pesan}</p>
                                </div>
                            `).join('')}
                        </div>
                        <form id="form-chat" class="p-4 border-t flex space-x-2 bg-slate-50 rounded-b-2xl">
                            <input type="text" id="input-chat" placeholder="Tulis pertanyaan seputar materi PAI..." class="flex-1 border rounded-xl p-3 text-xs focus:outline-none focus:border-primary bg-white" required>
                            <button type="submit" class="bg-primary text-white font-bold px-5 py-3 rounded-xl text-xs shadow hover:bg-red-700">Kirim</button>
                        </form>
                    </div>
                `;
                document.getElementById('form-chat').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const input = document.getElementById('input-chat');
                    diskusiList.push({
                        pengirim: `${currentUser.nama} (${currentUser.role.toUpperCase()})`,
                        pesan: input.value,
                        waktu: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    renderRuangBelajar(document.getElementById('main-view'));
                });
            } else if (currentTabRuang === 'tugas') {
                tabContent.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border shadow-sm max-w-4xl mx-auto space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Pengumpulan Tugas PAI & Karakter</h3>
                        <div class="p-4 border rounded-xl bg-slate-50 flex justify-between items-center text-xs">
                            <div>
                                <h4 class="font-bold text-sm">Tugas Penugasan Fiqih / Modul Jumat</h4>
                                <p class="text-slate-500">Tenggat waktu: Pukul 23.59 WIB.</p>
                            </div>
                            <button onclick="alert('Form unggah tugas dibuka')" class="px-4 py-2 bg-primary text-white font-bold rounded-xl hover:bg-red-700">Kumpulkan Tugas</button>
                        </div>
                    </div>
                `;
            } else if (currentTabRuang === 'kuis') {
                tabContent.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl border shadow-sm max-w-4xl mx-auto space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Kuis & Ujian CBT Online</h3>
                        <div class="p-4 border rounded-xl bg-slate-50 flex justify-between items-center text-xs">
                            <div>
                                <h4 class="font-bold text-sm">Kuis Evaluasi Agama Islam</h4>
                                <p class="text-slate-500">Durasi: 30 Menit • KKM 75</p>
                            </div>
                            <button onclick="alert('Memulai kuis online...')" class="px-4 py-2 bg-primary text-white font-bold rounded-xl hover:bg-red-700">Kerjakan Kuis</button>
                        </div>
                    </div>
                `;
            } else {
                tabContent.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl border shadow-sm text-center space-y-3 max-w-4xl mx-auto">
                        <h4 class="font-bold text-slate-800 text-base capitalize">Menu Tab: ${currentTabRuang}</h4>
                        <p class="text-xs text-slate-500">Modul interaktif ${currentTabRuang} siap digunakan.</p>
                    </div>
                `;
            }
        }

        // ================= MONITORING & LEGER NILAI =================
        function renderMonitoringKehadiran(container) {
            container.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg text-slate-900">Pemantauan Kehadiran Daring Jumat</h3>
                            <p class="text-xs text-slate-500">Rekap persentase presensi harian PJJ siswa SMK Taruna Harapan 2.</p>
                        </div>
                        <button onclick="alert('Mengunduh Laporan Kehadiran PDF...')" class="bg-primary text-white font-bold px-4 py-2 rounded-xl text-xs shadow hover:bg-red-700">Cetak Laporan PDF</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-green-500"><p class="text-xs font-bold text-slate-400 uppercase">X AKL</p><p class="text-2xl font-bold text-slate-900 mt-1">96%</p></div>
                        <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-blue-500"><p class="text-xs font-bold text-slate-400 uppercase">X TSM</p><p class="text-2xl font-bold text-slate-900 mt-1">90%</p></div>
                        <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-purple-500"><p class="text-xs font-bold text-slate-400 uppercase">XI AKL</p><p class="text-2xl font-bold text-slate-900 mt-1">95%</p></div>
                        <div class="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-amber-500"><p class="text-xs font-bold text-slate-400 uppercase">XI TSM</p><p class="text-2xl font-bold text-slate-900 mt-1">92%</p></div>
                    </div>
                </div>
            `;
        }

        function renderMonitoringKeaktifan(container) {
            container.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-lg text-slate-900">Pemantauan Keaktifan PJJ & Tugas</h3><p class="text-xs text-slate-500">Tingkat partisipasi pengumpulan tugas.</p></div>
                </div>
            `;
        }

        function renderLegerNilai(container) {
            container.innerHTML = `
                <div class="max-w-6xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg text-slate-900">Leger Nilai Seluruh Kelas (PJJ Ganjil)</h3>
                            <p class="text-xs text-slate-500">Rekapitulasi komponen nilai tugas, kuis, UTS/CBT, dan nilai akhir.</p>
                        </div>
                        <button onclick="window.print()" class="bg-slate-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">Cetak Leger</button>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border shadow-sm">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-100 font-bold border-b">
                                <tr><th class="p-3">NIS</th><th class="p-3">NAMA SISWA</th><th class="p-3">KELAS</th><th class="p-3">PRESENSI</th><th class="p-3">TUGAS</th><th class="p-3">KUIS</th><th class="p-3">NILAI AKHIR</th><th class="p-3">STATUS</th></tr>
                            </thead>
                            <tbody class="divide-y text-slate-700">
                                ${masterLegerNilai.map(l => `
                                    <tr><td class="p-3">${l.nis}</td><td class="p-3 font-bold">${l.nama}</td><td class="p-3">${l.kelas}</td><td class="p-3 text-green-600 font-semibold">${l.absensi}</td><td class="p-3">${l.tugas}</td><td class="p-3">${l.kuis}</td><td class="p-3 font-bold">${l.akhir}</td><td class="p-3"><span class="px-2 py-0.5 bg-green-100 text-green-700 font-bold rounded text-[10px]">${l.status}</span></td></tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        renderLogin();
    </script>
</body>
</html>
