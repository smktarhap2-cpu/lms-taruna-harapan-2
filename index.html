        function getData(table) {
            let primary = JSON.parse(localStorage.getItem(`th2_master_${table}`) || '[]');
            if (primary.length > 0) return primary;

            for (let v = 10; v <= 16; v++) {
                let oldData = JSON.parse(localStorage.getItem(`th2_${table}_v${v}`) || '[]');
                if (oldData.length > 0) {
                    localStorage.setItem(`th2_master_${table}`, JSON.stringify(oldData));
                    return oldData;
                }
            }
            return [];
        }

        function saveData(table, newItem) {
            let data = getData(table);
            data.unshift(newItem);
            localStorage.setItem(`th2_master_${table}`, JSON.stringify(data));
        }

        function removeData(table, id) {
            let data = getData(table);
            data = data.filter(item => item.id !== Number(id));
            localStorage.setItem(`th2_master_${table}`, JSON.stringify(data));
        }

                                        // Kalkulasi Nilai Akhir Otomatis Sederhana
                                        const nilaiAkhir = Math.min(100, (jmlTugas * 25) + (jmlKuis * 30) + (jmlAbsen * 15));

                                        return `

                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}

                            </table>
                        </div>
                    </div>
                </div>
            `;

                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    });
                    renderRuangBelajar(container);
                });
            } else if (currentTabRuang === 'anggota') {
                content.innerHTML = `
                    <div class="bg-white rounded-2xl border shadow-sm p-6 space-y-4">
                        <h3 class="font-bold text-sm text-slate-900 uppercase">Daftar Anggota Kelas & Pengajar</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                            ${masterSiswaLogin.map(s => `
                                <div class="p-3 border rounded-xl flex items-center space-x-3">
                                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-700">${s.nama[0]}</div>
                                    <div>
                                        <p class="font-bold text-slate-900">${s.nama}</p>
                                        <p class="text-[10px] text-slate-500">Peserta Didik • ${s.kelas}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        window.kirimAbsen = function() {
            saveData('presensi', {
                id: Date.now(),
                nama: currentUser.nama,
                kelas: currentUser.kelas,
                mapel: currentUser.mapel || 'Pelajaran Umum',
                waktu: new Date().toLocaleTimeString() + ' WIB'
            });
            alert('Presensi berhasil dikirim!');
        }

        window.simpanNilaiTugas = function(subId) {
            const val = document.getElementById(`nilai-${subId}`).value;
            alert(`Nilai ${val} berhasil disimpan! Sistem otomatis siap ke siswa berikutnya.`);
            renderActiveView();
        }

        window.mulaiCBT = function(judul) {
            alert(`Memulai Ujian CBT: ${judul}. Timer aktif, soal diacak.`);
        }

        window.kirimTugasSiswa = function(judul, tId) {
            const jawab = document.getElementById(`jawab-tugas-${tId}`).value;
            saveData('submissions', {
                id: Date.now(),
                namaSiswa: currentUser.nama,
                kelas: currentUser.kelas,
                judulTugas: judul,
                jawaban: jawab,
                waktu: new Date().toLocaleTimeString() + ' WIB'
            });
            alert('Tugas berhasil dikumpulkan ke pengajar!');
            renderActiveView();
        }

        // Handler Form Guru
        document.addEventListener('submit', async (e) => {
            if (e.target && e.target.id === 'form-add-materi') {
                e.preventDefault();
                const fileInput = document.getElementById('m-file');
                let fileData = '';
                if (fileInput.files[0]) {
                    fileData = await new Promise(r => {
                        const reader = new FileReader();
                        reader.onload = e => r(e.target.result);
                        reader.readAsDataURL(fileInput.files[0]);
                    });
                }
                saveData('materi', {
                    id: Date.now(),
                    judul: document.getElementById('m-judul').value,
                    youtube: document.getElementById('m-youtube').value,
                    teks: document.getElementById('m-teks').value,
                    file: fileData,
                    guru: currentUser.nama
                });
                alert('Materi berhasil dipublikasikan!');
                renderActiveView();
            } else if (e.target && e.target.id === 'form-add-tugas') {
                e.preventDefault();
                saveData('tugas', {
                    id: Date.now(),
                    judul: document.getElementById('t-judul').value,
                    deadline: document.getElementById('t-deadline').value,
                    instruksi: document.getElementById('t-instruksi').value,
                    guru: currentUser.nama
                });
                alert('Tugas berhasil dipublikasikan!');
                renderActiveView();
            } else if (e.target && e.target.id === 'form-add-kuis') {
                e.preventDefault();
                saveData('kuis', {
                    id: Date.now(),
                    judul: document.getElementById('k-judul').value,
                    waktu: document.getElementById('k-waktu').value,
                    importTeks: document.getElementById('k-import').value,
                    guru: currentUser.nama
                });
                alert('Kuis CBT berhasil dipublikasikan!');
                renderActiveView();
            }
        });

        renderLogin();
    </script>
</body>
</html>
