        async function fetchDataFromSupabase() {
            let mData = [], tData = [], kData = [], pData = [], pengData = [], chatData = [], subData = [], kuisSubData = [];
            try {
                const resM = await supabase.from('materi').select('*');
                if (resM.data) mData = resM.data;
                const resT = await supabase.from('tugas').select('*');
                if (resT.data) tData = resT.data;
                const resK = await supabase.from('kuis').select('*');
                if (resK.data) kData = resK.data;
                const resP = await supabase.from('presensi').select('*');
                if (resP.data) pData = resP.data;
                const resPeng = await supabase.from('pengumuman').select('*');
                if (resPeng.data) pengData = resPeng.data;
                const resChat = await supabase.from('chat_kelas').select('*');
                if (resChat.data) chatData = resChat.data;
                const resSub = await supabase.from('submissions').select('*');
                if (resSub.data) subData = resSub.data;
                const resKuisSub = await supabase.from('kuis_submissions').select('*');
                if (resKuisSub.data) kuisSubData = resKuisSub.data;
            } catch (err) {}

            return {
                materi: mData.length > 0 ? mData : JSON.parse(localStorage.getItem('th2_materi_v16') || '[]'),
                tugas: tData.length > 0 ? tData : JSON.parse(localStorage.getItem('th2_tugas_v16') || '[]'),
                kuis: kData.length > 0 ? kData : JSON.parse(localStorage.getItem('th2_kuis_v16') || '[]'),
                presensi: pData.length > 0 ? pData : JSON.parse(localStorage.getItem('th2_presensi_v16') || '[]'),
                pengumuman: pengData.length > 0 ? pengData : JSON.parse(localStorage.getItem('th2_pengumuman_v16') || '[{"judul": "Selamat Datang PJJ", "isi": "Portal PJJ aktif.", "waktu": "Hari Ini"}]'),
                chat: chatData.length > 0 ? chatData : JSON.parse(localStorage.getItem('th2_chat_v16') || '[]'),
                submissions: subData.length > 0 ? subData : JSON.parse(localStorage.getItem('th2_submissions_v16') || '[]'),
                kuisSubmissions: kuisSubData.length > 0 ? kuisSubData : JSON.parse(localStorage.getItem('th2_kuis_sub_v16') || '[]')
            };
        }

        async function saveCloud(table, newItem) {
            let local = JSON.parse(localStorage.getItem(`th2_${table}_v16`) || '[]');
            local.unshift(newItem);
            localStorage.setItem(`th2_${table}_v16`, JSON.stringify(local));
            try { await supabase.from(table).insert([newItem]); } catch (e) {}
        }

        async function deleteCloud(table, id) {
            let local = JSON.parse(localStorage.getItem(`th2_${table}_v16`) || '[]');
            local = local.filter(item => item.id !== id);
            localStorage.setItem(`th2_${table}_v16`, JSON.stringify(local));
            try { await supabase.from(table).delete().eq('id', id); } catch (e) {}
        }

                document.getElementById('form-add-tugas').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const editId = document.getElementById('edit-tugas-id').value;
                    const fileObj = await convertFileToBase64('t-file');
                    const linkUrl = document.getElementById('t-link').value;
                    const targetKelasVal = document.getElementById('t-kelas').value || 'X AKL';

                    let localTugas = JSON.parse(localStorage.getItem('th2_tugas_v16') || '[]');
                    if (editId) {
                        localTugas = localTugas.map(t => {
                            if (t.id == editId) {
                                t.judul = document.getElementById('t-judul').value;
                                t.deadline = document.getElementById('t-deadline').value;
                                t.targetKelas = targetKelasVal;
                                if (linkUrl) t.link = linkUrl;
                                if (fileObj) { t.link = fileObj.data; t.fileName = fileObj.name; t.isFile = true; }
                            }
                            return t;
                        });
                        localStorage.setItem('th2_tugas_v16', JSON.stringify(localTugas));
                        alert('Tugas berhasil diperbarui!');
                    } else {
                        const newItem = { 
                            id: Date.now(), 
                            judul: document.getElementById('t-judul').value, 
                            deadline: document.getElementById('t-deadline').value, 
                            link: fileObj ? fileObj.data : linkUrl,
                            fileName: fileObj ? fileObj.name : '',
                            isFile: !!fileObj,
                            targetKelas: targetKelasVal,
                            status: 'Dibuka',
                            guru: currentUser.nama
                        };
                        await saveCloud('tugas', newItem);
                        alert('Tugas berhasil dibuat!');
                    }
                    renderRuangBelajar(container);
                });
            }

            const bKuis = document.getElementById('btn-modal-kuis');
            if (bKuis) {
                bKuis.addEventListener('click', () => {
                    document.getElementById('edit-kuis-id').value = '';
                    document.getElementById('title-form-kuis').innerText = 'Buat Kuis / CBT';
                    document.getElementById('form-add-kuis').reset();
                    document.getElementById('modal-form-kuis').classList.toggle('hidden');
                });
                document.getElementById('batal-kuis').addEventListener('click', () => document.getElementById('modal-form-kuis').classList.add('hidden'));
                document.getElementById('form-add-kuis').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const editId = document.getElementById('edit-kuis-id').value;
                    const fileObj = await convertFileToBase64('k-file');
                    const linkUrl = document.getElementById('k-link').value;
                    const targetKelasVal = document.getElementById('k-kelas').value || 'X AKL';

                    let localKuis = JSON.parse(localStorage.getItem('th2_kuis_v16') || '[]');
                    if (editId) {
                        localKuis = localKuis.map(k => {
                            if (k.id == editId) {
                                k.judul = document.getElementById('k-judul').value;
                                k.waktu = document.getElementById('k-waktu').value;
                                k.targetKelas = targetKelasVal;
                                k.soalTemplate = document.getElementById('k-soal-template').value;
                                if (linkUrl) k.link = linkUrl;
                                if (fileObj) { k.link = fileObj.data; k.fileName = fileObj.name; k.isFile = true; }
                            }
                            return k;
                        });
                        localStorage.setItem('th2_kuis_v16', JSON.stringify(localKuis));
                        alert('Kuis berhasil diperbarui!');
                    } else {
                        const newItem = { 
                            id: Date.now(), 
                            judul: document.getElementById('k-judul').value, 
                            waktu: document.getElementById('k-waktu').value, 
                            link: fileObj ? fileObj.data : linkUrl,
                            fileName: fileObj ? fileObj.name : '',
                            isFile: !!fileObj,
                            soalTemplate: document.getElementById('k-soal-template').value,
                            targetKelas: targetKelasVal,
                            status: 'Dibuka',
                            guru: currentUser.nama
                        };
                        await saveCloud('kuis', newItem);
                        alert('Kuis / CBT berhasil dibuat!');
                    }
                    renderRuangBelajar(container);
                });
            }

            renderTabContent(materiList, tugasList, kuisList, chatList);
        }

        function renderTabContent(materiList, tugasList, kuisList, chatList) {
            const tabContent = document.getElementById('tab-content');
            const canModify = currentUser.role === 'guru' || currentUser.role === 'admin';

            if (currentTabRuang === 'materi') {
                tabContent.innerHTML = `
                    <div class="space-y-4">
                        ${materiList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada materi untuk kelas Anda.</p></div>' : materiList.map(m => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded">${m.format}</span>
                                        <span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-0.5 rounded">${m.mapel || 'Mapel Umum'}</span>
                                        <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">Kelas: ${m.targetKelas && m.targetKelas !== 'undefined' ? m.targetKelas : 'X AKL'}</span>
                                    </div>
                                    <h4 class="font-bold text-slate-900 text-sm">${m.judul}</h4>
                                    <p class="text-xs text-slate-500">Pengajar: ${m.guru || 'Guru'} • ${m.tanggal}</p>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <a href="${m.link}" target="_blank" class="text-xs bg-primary text-white font-semibold px-4 py-2 rounded-xl shadow hover:bg-red-700 flex items-center space-x-1">
                                        <i class="ph ph-download text-sm"></i><span>Akses File</span>
                                    </a>
                                    ${canModify ? `
                                        <button onclick="editMateri('${m.id}')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-2 rounded-xl text-xs font-bold">Edit</button>
                                        <button onclick="hapusKonten('materi', '${m.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-2 rounded-xl text-xs font-bold">Hapus</button>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'tugas') {
                tabContent.innerHTML = `
                    <div class="space-y-4">
                        ${tugasList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada tugas untuk kelas Anda.</p></div>' : tugasList.map(t => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">Kelas: ${t.targetKelas && t.targetKelas !== 'undefined' ? t.targetKelas : 'X AKL'}</span>
                                    <h4 class="font-bold text-slate-900 text-sm">${t.judul}</h4>
                                    <p class="text-xs text-slate-500">Guru: ${t.guru} • Tenggat: ${t.deadline}</p>
                                    ${t.link ? `<a href="${t.link}" target="_blank" class="text-xs text-blue-600 underline font-semibold block mt-1">📁 Lihat Soal / Petunjuk (${t.fileName || 'Link'})</a>` : ''}
                                </div>
                                <div class="flex flex-col md:flex-row items-end gap-2">
                                    ${currentUser.role === 'siswa' ? `
                                        <div class="bg-slate-50 p-3 border rounded-xl space-y-2 w-72">
                                            <p class="text-[11px] font-bold text-slate-700">Form Pengumpulan Tugas:</p>
                                            <textarea id="jawaban-teks-${t.id}" placeholder="Ketik jawaban teks di sini..." class="w-full border p-2 rounded-lg text-xs h-16 bg-white"></textarea>
                                            <input type="file" id="jawaban-file-${t.id}" accept="image/jpeg,image/png,.pdf,.doc,.docx,.xls,.xlsx" class="w-full text-[10px] bg-white border p-1 rounded-lg">
                                            <button onclick="kirimTugas('${t.judul.replace(/'/g, "\\'")}', '${t.id}')" class="w-full bg-primary hover:bg-red-700 text-white font-bold py-2 rounded-lg text-xs shadow">Kumpulkan Tugas</button>
                                        </div>
                                    ` : `
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl">Aktif</span>
                                            <button onclick="editTugas('${t.id}')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-2 rounded-xl text-xs font-bold">Edit</button>
                                            <button onclick="hapusKonten('tugas', '${t.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-2 rounded-xl text-xs font-bold">Hapus</button>
                                        </div>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'kuis') {
                tabContent.innerHTML = `
                    <div class="space-y-4">
                        ${kuisList.length === 0 ? '<div class="bg-white p-8 rounded-2xl border text-center"><p class="text-sm font-bold text-slate-700">Belum ada kuis untuk kelas Anda.</p></div>' : kuisList.map(k => `
                            <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div class="space-y-1">
                                    <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">Kelas: ${k.targetKelas && k.targetKelas !== 'undefined' ? k.targetKelas : 'X AKL'}</span>
                                    <h4 class="font-bold text-slate-900 text-sm">${k.judul}</h4>
                                    <p class="text-xs text-slate-500">Guru: ${k.guru} • Durasi: ${k.waktu}</p>
                                    ${k.isFile ? `<a href="${k.link}" target="_blank" class="text-xs text-green-600 underline font-semibold block mt-1">📁 Unduh File Soal (${k.fileName})</a>` : (k.link ? `<a href="${k.link}" target="_blank" class="text-xs text-blue-600 underline font-semibold block mt-1">🔗 Buka Link Kuis Eksternal</a>` : '')}
                                </div>
                                <div class="flex items-center space-x-2">
                                    ${currentUser.role === 'siswa' ? `
                                        <button onclick="bukaModalKerjakanKuis('${k.judul.replace(/'/g, "\\'")}', \`${encodeURIComponent(k.soalTemplate || '')}\`)" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2.5 rounded-xl text-xs shadow">Kerjakan Kuis</button>
                                    ` : `
                                        <button onclick="bukaModalKerjakanKuis('${k.judul.replace(/'/g, "\\'")}', \`${encodeURIComponent(k.soalTemplate || '')}\`)" class="bg-amber-100 text-amber-800 hover:bg-amber-200 font-bold px-3 py-2 rounded-xl text-xs">Pratinjau</button>
                                        <button onclick="editKuis('${k.id}')" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-2 rounded-xl text-xs font-bold">Edit</button>
                                        <button onclick="hapusKonten('kuis', '${k.id}')" class="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-2 rounded-xl text-xs font-bold">Hapus</button>
                                    `}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTabRuang === 'presensi') {
                const mapelListPilihan = currentUser.role === 'guru' ? (currentUser.mapels || [currentUser.mapel]) : ["PAI", "MTK", "Desain Grafis", "B. INGGRIS", "BP/BK", "B. SUNDA", "SEJARAH", "Seni Budaya", "Projek IPAS", "B. INDONESIA", "AK. Keuangan", "KOMP.AK", "PJOK", "INFORMATIKA", "DD TSM", "P. PANCASILA"];
                
                tabContent.innerHTML = `
                    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                        <h3 class="font-bold text-lg text-slate-900">Presensi Kehadiran Per Mata Pelajaran</h3>
                        <p class="text-xs text-slate-500">Pilih mata pelajaran yang sedang berlangsung sesuai jadwal jam pelajaran Anda saat ini.</p>
                        
                        <div class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold uppercase mb-1">Mata Pelajaran</label>
                                <select id="presensi-mapel-pilih" class="w-full border p-2.5 rounded-xl font-semibold bg-slate-50" required>
                                    ${mapelListPilihan.map(mp => `<option value="${mp}">${mp}</option>`).join('')}
                                </select>
                            </div>
                            <button onclick="kirimPresensiMapel()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-green-700">Kirim Kehadiran (Absen Mapel)</button>
                        </div>
                    </div>
                `;
            } else if (currentTabRuang === 'chat') {
                tabContent.innerHTML = `
                    <div class="bg-white rounded-2xl border shadow-sm flex flex-col h-[500px]">
                        <div class="p-4 border-b font-bold text-slate-900 text-sm">💬 Forum Diskusi Chat Kelas (${currentUser.kelas || 'Umum'})</div>
                        <div class="flex-1 p-5 overflow-y-auto space-y-3 text-xs">
                            ${chatList.length === 0 ? '<p class="text-slate-400 text-center">Belum ada percakapan di kelas ini.</p>' : chatList.map(c => `
                                <div class="p-3 rounded-xl bg-slate-50 border">
                                    <div class="flex justify-between items-center mb-1"><span class="font-bold text-primary">${c.pengirim}</span><span class="text-[10px] text-slate-400">${c.waktu}</span></div>
                                    <p class="text-slate-800">${c.pesan}</p>
                                </div>
                            `).join('')}
                        </div>
                        <form id="form-chat" class="p-4 border-t flex space-x-2 bg-slate-50 rounded-b-2xl">
                            <input type="text" id="chat-msg" placeholder="Tulis pesan ke kelas..." class="flex-1 border rounded-xl p-3 text-xs focus:outline-none focus:border-primary bg-white" required>
                            <button type="submit" class="bg-primary text-white font-bold px-5 py-3 rounded-xl text-xs shadow">Kirim</button>
                        </form>
                    </div>
                `;
                document.getElementById('form-chat').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const pesan = document.getElementById('chat-msg').value;
                    await saveCloud('chat_kelas', {
                        pengirim: `${currentUser.nama} (${currentUser.role})`,
                        kelas: currentUser.kelas || 'Umum',
                        pesan,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    });
                    renderRuangBelajar(container);
                });
            }
        }

        window.kirimPresensiMapel = async function() {
            const mapelPilihan = document.getElementById('presensi-mapel-pilih').value;
            const presensiItem = {
                id: Date.now(),
                nama: currentUser.nama,
                kelas: currentUser.kelas,
                mapel: mapelPilihan,
                waktu: new Date().toLocaleTimeString() + ' WIB - ' + new Date().toLocaleDateString()
            };
            await saveCloud('presensi', presensiItem);
            alert(`Kehadiran untuk mata pelajaran ${mapelPilihan} berhasil dicatat!`);
            location.reload();
        }

        window.hapusKonten = async function(table, id) {
            if (confirm('Apakah Anda yakin ingin menghapus konten ini?')) {
                await deleteCloud(table, Number(id));
                alert('Konten berhasil dihapus!');
                location.reload();
            }
        }

        window.editMateri = function(id) {
            const materiList = JSON.parse(localStorage.getItem('th2_materi_v16') || '[]');
            const m = materiList.find(item => item.id == id);
            if (m) {
                document.getElementById('edit-materi-id').value = m.id;
                document.getElementById('title-form-materi').innerText = 'Edit Materi Pembelajaran';
                document.getElementById('m-judul').value = m.judul;
                document.getElementById('target-kelas').value = m.targetKelas && m.targetKelas !== 'undefined' ? m.targetKelas : 'X AKL';
                document.getElementById('modal-form-materi').classList.remove('hidden');
            }
        }

        window.editTugas = function(id) {
            const tugasList = JSON.parse(localStorage.getItem('th2_tugas_v16') || '[]');
            const t = tugasList.find(item => item.id == id);
            if (t) {
                document.getElementById('edit-tugas-id').value = t.id;
                document.getElementById('title-form-tugas').innerText = 'Edit Tugas Pembelajaran';
                document.getElementById('t-judul').value = t.judul;
                document.getElementById('t-deadline').value = t.deadline;
                document.getElementById('t-kelas').value = t.targetKelas && t.targetKelas !== 'undefined' ? t.targetKelas : 'X AKL';
                document.getElementById('modal-form-tugas').classList.remove('hidden');
            }
        }

        window.editKuis = function(id) {
            const kuisList = JSON.parse(localStorage.getItem('th2_kuis_v16') || '[]');
            const k = kuisList.find(item => item.id == id);
            if (k) {
                document.getElementById('edit-kuis-id').value = k.id;
                document.getElementById('title-form-kuis').innerText = 'Edit Kuis / CBT';
                document.getElementById('k-judul').value = k.judul;
                document.getElementById('k-waktu').value = k.waktu;
                document.getElementById('k-kelas').value = k.targetKelas && k.targetKelas !== 'undefined' ? k.targetKelas : 'X AKL';
                document.getElementById('k-soal-template').value = k.soalTemplate || '';
                document.getElementById('modal-form-kuis').classList.remove('hidden');
            }
        }

        window.bukaModalKerjakanKuis = function(judulKuis, encodedTemplate) {
            const templateSoal = decodeURIComponent(encodedTemplate);
            const modalDiv = document.createElement('div');
            modalDiv.className = 'fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 overflow-y-auto';
            modalDiv.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-bold text-base text-slate-900">Ujian CBT: ${judulKuis}</h3>
                        <button onclick="this.closest('.fixed').remove()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>
                    </div>
                    <div class="space-y-3 text-xs">
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <p class="font-bold text-slate-700 mb-1">Soal Kuis:</p>
                            <pre class="whitespace-pre-wrap font-sans text-slate-800">${templateSoal}</pre>
                        </div>
                        ${currentUser.role === 'siswa' ? `
                            <div>
                                <label class="block font-bold uppercase mb-1">Lembar Jawaban Anda:</label>
                                <textarea id="input-jawaban-kuis" rows="6" placeholder="Ketik jawaban Anda di sini..." class="w-full border p-3 rounded-xl text-xs bg-white" required></textarea>
                            </div>
                            <div>
                                <label class="block font-bold uppercase mb-1">Atau Upload File Jawaban (Opsional)</label>
                                <input type="file" id="file-jawaban-kuis" accept="image/*,.pdf,.doc,.docx" class="w-full border p-2 rounded-xl bg-slate-50">
                            </div>
                        ` : ''}
                    </div>
                    <div class="flex justify-end space-x-2 pt-2 border-t">
                        <button onclick="this.closest('.fixed').remove()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-xs">Tutup</button>
                        ${currentUser.role === 'siswa' ? `<button onclick="kirimJawabanKuis('${judulKuis.replace(/'/g, "\\'")}')" class="bg-primary hover:bg-red-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow">Kirim Jawaban Kuis</button>` : ''}
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);
        }

        window.kirimJawabanKuis = async function(judulKuis) {
            const jawabanTeks = document.getElementById('input-jawaban-kuis').value.trim();
            const fileInput = document.getElementById('file-jawaban-kuis');

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const submission = {
                        id: Date.now(),
                        namaSiswa: currentUser.nama,
                        kelas: currentUser.kelas,
                        judulKuis: judulKuis,
                        jawabanRekap: `File: ${file.name}\nTeks: ${jawabanTeks || '-'}`,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    };
                    await saveCloud('kuis_submissions', submission);
                    alert('Jawaban kuis berhasil dikumpulkan!');
                    document.querySelector('.fixed').remove();
                    location.reload();
                };
                reader.readAsDataURL(file);
                return;
            }

            if (!jawabanTeks) {
                alert('Harap isi lembar jawaban kuis Anda terlebih dahulu!');
                return;
            }

            const submission = {
                id: Date.now(),
                namaSiswa: currentUser.nama,
                kelas: currentUser.kelas,
                judulKuis: judulKuis,
                jawabanRekap: jawabanTeks,
                waktu: new Date().toLocaleTimeString() + ' WIB'
            };
            await saveCloud('kuis_submissions', submission);
            alert('Jawaban kuis berhasil dikumpulkan!');
            document.querySelector('.fixed').remove();
            location.reload();
        }

        window.kirimTugas = async function(judulTugas, tugasId) {
            const teks = document.getElementById(`jawaban-teks-${tugasId}`).value.trim();
            const fileInput = document.getElementById(`jawaban-file-${tugasId}`);

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const submission = {
                        id: Date.now(),
                        namaSiswa: currentUser.nama,
                        kelas: currentUser.kelas,
                        judulTugas: judulTugas,
                        jawaban: e.target.result,
                        isFile: true,
                        fileName: file.name,
                        waktu: new Date().toLocaleTimeString() + ' WIB'
                    };
                    await saveCloud('submissions', submission);
                    alert('Tugas beserta file berhasil dikumpulkan!');
                    location.reload();
                };
                reader.readAsDataURL(file);
                return;
            }

            if (!teks) {
                alert('Harap isi jawaban teks atau lampirkan file tugas terlebih dahulu!');
                return;
            }

            const submission = {
                id: Date.now(),
                namaSiswa: currentUser.nama,
                kelas: currentUser.kelas,
                judulTugas: judulTugas,
                jawaban: teks,
                isFile: false,
                waktu: new Date().toLocaleTimeString() + ' WIB'
            };
            await saveCloud('submissions', submission);
            alert('Jawaban tugas teks berhasil dikumpulkan!');
            location.reload();
        }

        renderLogin();
    </script>
</body>
</html>
